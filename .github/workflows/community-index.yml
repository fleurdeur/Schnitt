name: Index community uploads

on:
  push:
    paths:
      - 'docs/community/data/presets/**'
      - 'docs/community/data/xml/**'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index
        run: python3 tools/community_index.py
      - name: Commit index
        run: |
          git config user.name "fleurdeur"
          git config user.email "319274093+fleurdeur@users.noreply.github.com"
          git add docs/community/data/index.json
          if git diff --cached --quiet; then
            echo "Index already current"
          else
            git commit -m "Index community uploads"
            git push
          fi
