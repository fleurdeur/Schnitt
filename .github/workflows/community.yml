name: Publish approved community file

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'community-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish approved files
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python3 tools/community_publish.py
      - name: Commit
        run: |
          git config user.name "fleurdeur"
          git config user.email "319274093+fleurdeur@users.noreply.github.com"
          git add docs/community/data
          if git diff --cached --quiet; then
            echo "Already published"
          else
            git commit -m "Publish community submission #${{ github.event.issue.number }}"
            git push
          fi
      - name: Comment on the issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Approved and published to the Schnitt community list. It will appear in the app after the next refresh.'
            })
